apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
spec:
  selector:
    matchLabels:
      app: log-agent
  template:
    metadata:
      labels:
        app: log-agent
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting log agent..."
              while true; do
                FILES=$(find /var/log/containers -type l -name "*log-sidecar*.log" 2>/dev/null)
                if [ -n "$FILES" ]; then
                  echo "Found log files:"
                  echo "$FILES"
                  tail -n+1 -F $FILES
                else
                  echo "No matching container logs yet, waiting..."
                  sleep 5
                fi
              done
          volumeMounts:
            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
            type: Directory
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: DirectoryOrCreate
